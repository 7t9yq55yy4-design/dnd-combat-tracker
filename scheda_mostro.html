<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Combat Tracker</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>

        <header class="sheet-header">

        <!-- SINISTRA -->
        <div class="header-left">
            <div class="field">
            <label>Nome mostro</label>
            <input type="text" id="nomeMInput">
            </div>

            <div class="row">
            <div class="field">
                <label>Allineamento</label>
                <input type="text" id="allineamento">
            </div>
            </div>

            <div class="field small">
                <label>Taglia</label>
                <input type="text" id="taglia">
            </div>
        </div>

        <!-- DESTRA -->
        <div class="header-right">

            <div class="GS">
            <label>Grado Sfida</label>
            <input type="number" value="1" id="GS">
            </div>

            <div class="field small">
                <label>Categoria</label>

                <select id="categoria">
                    <option value="Mostro">Mostro</option>
                    <option value="Nemico">Nemico</option>
                    <option value="Alleato">Alleato</option>
                </select>
            </div>
        </div>

        </header>

    <h1>Scheda del mostro</h1>

    <div class="monster-combat-row">

    <div class="combat-field">
        <label>Classe Armatura</label>
        <input type="number" id="CA">
    </div>

    <div class="combat-field">
        <label>Punti Ferita</label>
        <input type="number" id="PF">
    </div>

    <div class="combat-field">
        <label>Velocità</label>
        <input type="text" id="velocita" placeholder="9m">
    </div>

</div>

    <h2>Caratteristiche</h2>

    <div class="section stats">
        <div class="stat">
            <h3>For</h3>
            <input type="number" id="forzScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modFor">+0</div>
        </div>
        <div class="stat">
            <h3>Des</h3>
            <input type="number" id="desScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modDes">+0</div>
        </div>
        <div class="stat">
            <h3>Cos</h3>
            <input type="number" id="cosScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modCos">+0</div>
        </div>
        <div class="stat">
            <h3>Int</h3>
            <input type="number" id="intScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modInt">+0</div>
        </div>
        <div class="stat">
            <h3>Sag</h3>
            <input type="number" id="sagScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modSag">+0</div>
        </div>
        <div class="stat">
            <h3>Car</h3>
            <input type="number" id="carScheda" inputmode="numeric" placeholder="0">
            <div class="mod" id="modCar">+0</div>
        </div>
    
    </div>

    <div>

        <div class="row">

            <div class="field">
                <label>Skill e Talenti</label>
                <textarea id="skill" class="auto-expand"></textarea>
            </div>

    </div>

     <hr class="monster-separator">

        <div class="column">

            <div class="field">
                <label>Azioni</label>
                <textarea id="azioni" class="auto-expand"></textarea>
            </div>

            <div class="field">
                <label>Reazioni</label>
                <textarea id="reazioni" class="auto-expand"></textarea>
            </div>

    </div>
        </div>
    </div>
</div>
    <script src="scheda_mostro.js"></script>

    <nav class="bottom-bar">
        <button class="tab-btn" id="btnHome">🏠</button>
        <button class="tab-btn" id="btnCombattimento">⚔️</button>
        <button class="tab-btn" id="btnNemico">👹</button>
        <button id="btnSalva" class="hidden">💾</button>
        <button id="btnEliminaMostro" class="delete-btn">🗑</button>
    </nav>

    <script src="navigazione.js"></script>

</body>
</html>
